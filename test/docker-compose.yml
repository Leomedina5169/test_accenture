services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: franchises_db
      MYSQL_USER: franchises_user
      MYSQL_PASSWORD: franchises_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: franchises-docker-secret-key-min-32-chars!!
    depends_on:
      mysql:
        condition: service_healthy
