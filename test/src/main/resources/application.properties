spring.application.name=franchises-api

spring.r2dbc.url=r2dbc:mysql://localhost:3306/franchises_db
spring.r2dbc.username=franchises_user
spring.r2dbc.password=franchises_pass

spring.datasource.url=jdbc:mysql://localhost:3306/franchises_db
spring.datasource.username=franchises_user
spring.datasource.password=franchises_pass

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:franchises-local-secret-key-min-32-chars!!}
jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
